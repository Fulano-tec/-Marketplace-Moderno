<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- HEADER -->
    <header class="header">

        <div class="logo">
            Admin Panel
        </div>

        <nav class="nav">

            <a href="index.html">Site</a>
            <a href="electronics.html">Produtos</a>
            <a href="cart.html">Carrinho</a>

        </nav>

    </header>

    <!-- DASHBOARD -->
    <section class="admin">

        <div class="section-title">

            <h2>Dashboard</h2>

            <span>Visão geral do marketplace</span>

            <p style="color:#94a3b8; margin-top:5px;">
                Dados baseados no carrinho local do navegador
            </p>

        </div>

        <div class="admin-cards">

            <div class="admin-card">
                <h3>Total de Produtos</h3>
                <p id="totalProducts">0</p>
            </div>

            <div class="admin-card">
                <h3>Pedidos</h3>
                <p id="ordersCount">0</p>
            </div>

            <div class="admin-card">
                <h3>Receita Estimada</h3>
                <p id="revenue">R$ 0</p>
            </div>

        </div>

    </section>

    <!-- SCRIPT -->
    <script>
        const cart = JSON.parse(localStorage.getItem("cart")) || [];

        const totalProducts = document.getElementById("totalProducts");
        const ordersCount = document.getElementById("ordersCount");
        const revenue = document.getElementById("revenue");

        // total de produtos
        totalProducts.textContent = cart.length;

        // pedidos simulados
        ordersCount.textContent = Math.floor(cart.length / 2);

        // receita total
        const total = cart.reduce((sum, item) => {
            return sum + (item.price || 0);
        }, 0);

        revenue.textContent = "R$ " + total.toLocaleString("pt-BR");
    </script>

</body>

</html>
