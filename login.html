<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Marketplace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app-header"></div>

  <div class="auth-page">
    <div class="auth-card">
      <h2>Entrar</h2>
      <p class="subtitle">Acesse sua conta na plataforma</p>

      <form id="loginForm">
        <div class="form-group">
          <label>E-mail</label>
          <input type="email" placeholder="voce@email.com" required />
        </div>
        <div class="form-group">
          <label>Senha</label>
          <input type="password" placeholder="••••••••" required />
        </div>
        <button type="submit" class="btn-primary">Entrar</button>
      </form>

      <a href="register.html" class="auth-link">Não tem conta? Cadastre-se</a>
    </div>
  </div>

  <div id="app-footer"></div>
  <div class="toast" id="toast"></div>

  <script src="products.js"></script>
  <script src="common.js"></script>
  <script>
    mountLayout("");
    document.getElementById("loginForm").addEventListener("submit", (e) => {
      e.preventDefault();
      showToast("Login simulado com sucesso!");
      setTimeout(() => (window.location.href = "index.html"), 900);
    });
  </script>
</body>
</html>
